services:
  - type: web
    name: legallenz-backend
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt && python create_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENROUTER_API_KEY
        sync: false
